# Configuracao do coletor. Caminhos relativos sao resolvidos a partir desta pasta (app/).
# Outro arquivo pode ser indicado pela variavel de ambiente RP_CONFIG.

[caminhos]
# Banco ATIVO e logs: pasta local FORA do OneDrive (SQLite em pasta sincronizada pode corromper).
# O programa recusa abrir o banco ativo dentro de uma pasta do OneDrive.
# "~" = pasta do usuario em qualquer sistema. Outra pasta: variavel de ambiente RP_DADOS_LOCAIS.
dados_locais = "~/RestosAPagar_local"
# Bruto imutavel (objetos + manifestos) e copias do banco: arquivos gravados uma unica vez.
# Ficam no projeto, no OneDrive, e a sincronizacao serve de copia fora da maquina.
snapshots = "../data/snapshots"
backups = "../data/backups"

[api]
# So https: a validacao recusa http, credencial na URL, query ou fragmento.
base = "https://servicos.pontagrossa.pr.gov.br/portaltransparencia-api"
pausa_segundos = 1.5        # intervalo minimo entre duas requisicoes
timeout_segundos = 120      # por leitura (maior silencio aceito); o prazo total ABSOLUTO de uma requisicao e 3x este valor
timeout_conexao_segundos = 30   # para estabelecer a conexao (nunca maior que timeout_segundos)
tentativas = 3              # so para 5xx, 429 e erro de rede; 4xx nunca e repetido
espera_base_segundos = 5    # espera antes de repetir: base x 2^(tentativa-1); Retry-After limitado a 300 s
limite_resposta_bytes = 67108864   # 64 MiB: teto do corpo de uma resposta (a maior real tem poucos MB)
user_agent = "RestosAPagarPG-coletor (pesquisa sobre dados publicos de Restos a Pagar)"

[rreo]
# Entidade cujas publicacoes da LRF (grupo 1 do portal) trazem o RREO Anexo VII, por entidade e consolidado.
entidade_publicacoes = 1

[escopo]
# Entidades da carga (Etapa 04). O coletor aceita qualquer entidade passada explicitamente.
entidades = [1, 15, 4, 5, 8]
exercicios = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
