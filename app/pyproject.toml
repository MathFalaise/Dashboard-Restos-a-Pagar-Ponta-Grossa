# Installable package with the `rp` command (critical review, item 38). ALWAYS install in editable mode, from inside
# app/:  python -m pip install -e .
# The package finds config.toml, the store (../data/snapshots) and the backups from the app/ folder (rp/config.py, RAIZ_APP);
# installed as a copy in site-packages, it would not find them. Tests still run with `python -m pytest tests`.
# No [tool.pytest]: the test configuration lives in tests/conftest.py.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "restos-a-pagar-pg"
dynamic = ["version"]
description = "Coletor, processamento e painel somente leitura dos Restos a Pagar de Ponta Grossa"
requires-python = ">=3.11"
# same versions as requirements.txt; the whole homologated environment is in requirements-lock.txt
dependencies = ["requests==2.34.2", "pymupdf==1.28.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
rp = "rp.cli:main"

[tool.setuptools]
packages = ["rp", "rp.painel", "rp.painel.consulta", "rp.interface", "rp.interface.paginas"]

[tool.setuptools.package-data]
rp = ["esquema.sql"]
"rp.interface" = ["estilo.css"]

[tool.setuptools.dynamic]
version = {attr = "rp.VERSAO"}
