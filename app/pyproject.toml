# Pacote instalavel com o comando `rp` (revisao critica, item 38). Instalar SEMPRE em modo editavel, de dentro de
# app/:  python -m pip install -e .
# O pacote acha config.toml, o armazem (../data/snapshots) e os backups a partir da pasta app/ (rp/config.py, RAIZ_APP);
# instalado como copia em site-packages, ele nao os encontraria. Os testes continuam com `python -m pytest tests`.
# Sem [tool.pytest]: a configuracao dos testes mora em tests/conftest.py.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "restos-a-pagar-pg"
dynamic = ["version"]
description = "Coletor, processamento e painel somente leitura dos Restos a Pagar de Ponta Grossa"
requires-python = ">=3.11"
# mesmas versoes de requirements.txt; o ambiente homologado inteiro esta em requirements-lock.txt
dependencies = ["requests==2.34.2", "pymupdf==1.28.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
rp = "rp.cli:main"

[tool.setuptools]
packages = ["rp", "rp.painel", "rp.interface"]

[tool.setuptools.package-data]
rp = ["esquema.sql"]
"rp.interface" = ["estilo.css"]

[tool.setuptools.dynamic]
version = {attr = "rp.VERSAO"}
