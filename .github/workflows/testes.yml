# Testes automaticos (revisao critica, itens 34, 36, 37 e 38). Nenhum teste acessa a internet; so o pip baixa pacotes.
#
# * sinteticos: Linux e Windows, Python 3.11 a 3.14. So os testes com dados inventados (-m "not dados_reais"):
#   e o que prova a portabilidade declarada no README.
# * dados_reais: o ambiente homologado (requirements-lock.txt com hashes, Python 3.14) nos dois sistemas. Monta bancos
#   temporarios a partir do armazem ../data/snapshots e do bruto das Etapas 01/02, confere os hashes homologados e roda os
#   26 testes da investigacao (docs/stages/03-data-model/validation). Se um dia o bruto sair do repositorio, os passos sao pulados.
# * dependencias: pip-audit sobre a trava com hashes (decisao D5): versao travada com vulnerabilidade conhecida reprova.
# * pacote: instalacao editavel e o comando `rp`.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sinteticos:
    name: sinteticos (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: sintaxe de todo o codigo nesta versao do Python
        run: python -m compileall -q rp tests ../rp.py ../docs/stages/03-data-model/validation
      - run: python -m pytest tests -q -m "not dados_reais"

  dados_reais:
    name: dados reais (${{ matrix.os }}, ambiente homologado)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: ambiente homologado, cada arquivo conferido pelo hash da trava
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: testes com o armazem real e o bruto das Etapas 01/02
        if: hashFiles('data/snapshots/coletas/**') != '' && hashFiles('data/stage02-raw/**') != ''
        run: python -m pytest tests -q -m dados_reais
      - name: testes da investigacao (Etapa 03)
        if: hashFiles('data/stage02-raw/**') != ''
        working-directory: docs/stages/03-data-model/validation
        run: python -m pytest tests -q

  dependencias:
    # Decisao D5 da revisao critica (06/10/2026): vulnerabilidade conhecida numa versao travada reprova o CI.
    # A trava tem hashes: o pip-audit confere os mesmos arquivos que o ambiente homologado instala.
    name: dependencias sem vulnerabilidade conhecida (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r app/requirements-lock.txt --require-hashes --disable-pip

  pacote:
    name: pacote instalavel (comando rp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: rp --help
      - name: de outra pasta, o comando acha config.toml e o armazem do repositorio
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          rp iniciar > iniciar.json
          python - <<'EOF'
          import json, os
          d = json.load(open("iniciar.json", encoding="utf-8"))
          assert os.path.samefile(d["snapshots"], os.path.join(os.environ["GITHUB_WORKSPACE"], "snapshots")), d
          print(d)
          EOF
