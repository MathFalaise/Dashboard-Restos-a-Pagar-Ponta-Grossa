# Automated tests (critical review, items 34, 36, 37 and 38). No test accesses the internet; only pip downloads packages.
#
# * sinteticos: Linux and Windows, Python 3.11 to 3.14. Only the tests with invented data (-m "not dados_reais"):
#   this is what proves the portability stated in the README.
# * dados_reais: the homologated environment (requirements-lock.txt with hashes, Python 3.14) on both systems. Builds
#   temporary databases from the ../data/snapshots store and the raw data of stages 01/02, checks the homologated hashes and runs
#   the 26 investigation tests (docs/stages/03-data-model/validation). If the raw data ever leaves the repository, these steps are skipped.
# * dependencias: pip-audit over the lock file with hashes (decision D5): a locked version with a known vulnerability fails.
# * pacote: editable install and the `rp` command.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sinteticos:
    name: sinteticos (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: sintaxe de todo o codigo nesta versao do Python
        run: python -m compileall -q rp tests ../rp.py ../docs/stages/03-data-model/validation
      - run: python -m pytest tests -q -m "not dados_reais"

  dados_reais:
    name: dados reais (${{ matrix.os }}, ambiente homologado)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: ambiente homologado, cada arquivo conferido pelo hash da trava
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: testes com o armazem real e o bruto das Etapas 01/02
        if: hashFiles('data/snapshots/coletas/**') != '' && hashFiles('data/stage02-raw/**') != ''
        run: python -m pytest tests -q -m dados_reais
      - name: testes da investigacao (Etapa 03)
        if: hashFiles('data/stage02-raw/**') != ''
        working-directory: docs/stages/03-data-model/validation
        run: python -m pytest tests -q

  dependencias:
    # Decision D5 of the critical review (06/10/2026): a known vulnerability in a locked version fails the CI.
    # The lock file has hashes: pip-audit checks the same files the homologated environment installs.
    name: dependencias sem vulnerabilidade conhecida (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r app/requirements-lock.txt --require-hashes --disable-pip

  pacote:
    name: pacote instalavel (comando rp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: rp --help
      - name: de outra pasta, o comando acha config.toml e o armazem do repositorio
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          rp iniciar > iniciar.json
          python - <<'EOF'
          import json, os
          d = json.load(open("iniciar.json", encoding="utf-8"))
          assert os.path.samefile(d["snapshots"], os.path.join(os.environ["GITHUB_WORKSPACE"], "snapshots")), d
          print(d)
          EOF
