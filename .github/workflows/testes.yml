# Automated tests (critical review, items 34, 36, 37 and 38). No test accesses the internet; only pip downloads packages.
#
# * sinteticos: Linux and Windows, Python 3.11 to 3.14. Only the tests with invented data (-m "not dados_reais"):
#   this is what proves the portability stated in the README. It also runs the privacy guard of the public repository
#   (tests/test_privacidade_repositorio.py): no raw data, database copy or real CPF may be versioned again.
# * dependencias: pip-audit over the lock file with hashes (decision D5): a locked version with a known vulnerability fails.
# * pacote: editable install and the `rp` command.
# Corrective audit of 13/10/2026 (phase P0): the raw data left the public repository. The tests with real data (marker
# dados_reais, 169 tests, and the 26 investigation tests) run only in the PRIVATE environment that holds the store, as
# part of `python -m rp homologar`; the CI no longer has the data to run them and no longer pretends to.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sinteticos:
    name: sinteticos (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: sintaxe de todo o codigo nesta versao do Python
        run: python -m compileall -q rp tests ../rp.py ../docs/stages/03-data-model/validation
      - run: python -m pytest tests -q -m "not dados_reais"

  dependencias:
    # Decision D5 of the critical review (06/10/2026): a known vulnerability in a locked version fails the CI.
    # The lock file has hashes: pip-audit checks the same files the homologated environment installs.
    name: dependencias sem vulnerabilidade conhecida (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r app/requirements-lock.txt --require-hashes --disable-pip

  pacote:
    name: pacote instalavel (comando rp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: rp --help
      - name: de outra pasta, o comando acha config.toml e o armazem privado fica fora do repositorio
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          rp iniciar > iniciar.json
          python - <<'EOF'
          import json, os
          from pathlib import Path
          d = json.load(open("iniciar.json", encoding="utf-8"))
          raiz = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for chave in ("snapshots", "backups"):
              assert not Path(d[chave]).resolve().is_relative_to(raiz), d
              assert Path(d[chave]).resolve().is_relative_to(Path.home().resolve()), d
          print(d)
          EOF
